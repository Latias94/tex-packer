name: Validate release tag

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Annotated release tag; empty means the caller tag"
        required: false
        default: ""
        type: string
    outputs:
      release_tag:
        description: "Validated release tag"
        value: ${{ jobs.validate.outputs.release_tag }}
      version:
        description: "Validated package version"
        value: ${{ jobs.validate.outputs.version }}
      source_sha:
        description: "Commit targeted by the annotated tag"
        value: ${{ jobs.validate.outputs.source_sha }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate annotated tag and source
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate release input
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          release_tag="$REQUESTED_TAG"
          if [[ -n "$release_tag" ]]; then
            expected_ref="refs/heads/$DEFAULT_BRANCH"
            if [[ "$EVENT_REF" != "$expected_ref" ]]; then
              echo "::error::Manual crate publishing must be dispatched from $expected_ref"
              exit 1
            fi
          else
            if [[ "$EVENT_REF_TYPE" != "tag" ]]; then
              echo "::error::The caller must run on a git tag"
              exit 1
            fi
            release_tag="${GITHUB_REF_NAME:?missing caller tag}"
          fi

          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'
          if [[ ! "$release_tag" =~ $tag_pattern ]]; then
            echo "::error::release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N"
            exit 1
          fi

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'version=%s\n' "${release_tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify annotated tag and source commit
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "::error::$RELEASE_TAG must be an annotated tag"
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo "::error::Checked-out source does not match $RELEASE_TAG"
            exit 1
          fi

          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          echo "Verified release source: $source_sha"
